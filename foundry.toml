[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.20"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 1000000
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]
verbosity = 3

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"
monad_mainnet = "https://rpc.monad.xyz"

[fuzz]
runs = 1000
max_test_rejects = 65536

[invariant]
runs = 256
depth = 15
fail_on_revert = true
